name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen   # ヘッドレスで PySide6 を動かす
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (for offscreen PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes pytest

      - name: Syntax / undefined-name check (logic modules)
        run: |
          python -m pyflakes $(git ls-files '*.py' | grep -vE '^(単一ファイル版/|tools/)') 2>&1 \
            | grep "undefined name '" | grep -v "may be undefined" && exit 1 || echo "no undefined names"

      - name: Build single-file editions
        # 生成物は git で管理しない（本体1行の修正で1万行超の差分が出るため）。
        # CI では毎回ビルドして、結合が壊れていないことを確かめる。
        run: |
          python tools/build_onefile.py
          python tools/build_simple_onefile.py

      - name: Run tests (offscreen)
        run: python -m pytest tests/ -v

      - name: Upload single-file editions
        # 「1ファイルだけ持ち出す」用途はここから取得できる
        uses: actions/upload-artifact@v4
        with:
          name: single-file-editions
          path: |
            単一ファイル版/graph_onefile.py
            単一ファイル版/graph_simple_onefile.py
